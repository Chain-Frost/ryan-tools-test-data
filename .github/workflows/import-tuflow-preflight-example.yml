name: Import TUFLOW preflight example fixture

on:
  push:
    branches:
      - feat/tuflow-preflight-example-fixture
    paths:
      - ".github/workflows/import-tuflow-preflight-example.yml"

permissions:
  contents: write

jobs:
  import-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch pinned existing fixture without recompression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tuflow/example_input_preflight
          SOURCE="https://raw.githubusercontent.com/Chain-Frost/ryan-tools/aaa475e30eb5397d7b88adeffb970ff0c5155b6f/tests/fixtures/tuflow_example_repro"
          curl --fail --location --retry 3 --silent --show-error "$SOURCE/examples.zip" -o tuflow/example_input_preflight/examples.zip
          curl --fail --location --retry 3 --silent --show-error "$SOURCE/manifest.json" -o tuflow/example_input_preflight/manifest.json
          curl --fail --location --retry 3 --silent --show-error "$SOURCE/baseline.csv" -o tuflow/example_input_preflight/baseline.csv

      - name: Verify archived bytes and measure one-time extraction
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          import json, tempfile, time
          folder = Path("tuflow/example_input_preflight")
          manifest = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
          data = (folder / "examples.zip").read_bytes()
          original = "e374c8e072679fc6c4dc11e63b270caa1101b6aebb84d70060872cdd1b0aa7d6"
          checksum = sha256(data).hexdigest()
          assert checksum == original == manifest["archive_sha256"], (checksum, original)
          with ZipFile(folder / "examples.zip") as z:
              expected = manifest["files"]
              assert len(expected) == 1464
              assert set(z.namelist()) == {item["path"] for item in expected}
              for item in expected:
                  contents = z.read(item["path"])
                  assert len(contents) == item["size"]
                  assert sha256(contents).hexdigest() == item["sha256"]
              with tempfile.TemporaryDirectory() as tmp:
                  start = time.perf_counter()
                  z.extractall(tmp)
                  duration = time.perf_counter() - start
                  total = sum(item["size"] for item in expected)
                  print(f"Verified {len(expected)} files, {len(data)} ZIP bytes and {total} extracted bytes")
                  print(f"One-time extraction on GitHub-hosted SSD: {duration:.3f} seconds")
          PY

      - name: Commit fixture to test-data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuflow/example_input_preflight
          if git diff --cached --quiet; then
            echo "Fixture already present"
            exit 0
          fi
          git commit -m "Add verified archived TUFLOW input preflight examples"
          git push origin HEAD:feat/tuflow-preflight-example-fixture
